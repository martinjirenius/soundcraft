[package]
name = "soundcraft-x11-window"
description = "SoundCraft X11 host window for plugin editors: a top-level window a plugin's own editor parents itself into (pure Rust, x11rb)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The X11 connection is pure Rust (no libxcb); only the Linux/BSD hosts have X11 windows.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11rb = { version = "0.13", default-features = false }

[lints]
workspace = true
